# SYNTHETIC templates for the golden cases only. See hdfc.yaml in this folder.
version: "2026.11.2"
bank: icici
templates:
  - id: icici.acct.debit.v1
    kind: DEBIT
    channel: OTHER
    date_format: dd-MMM-yy
    pattern: 'Acct XX(?<last4>\d{4}) debited for Rs\s?(?<amount>[\d,]+(?:\.\d{1,2})?) on (?<date>\d{2}-[A-Za-z]{3}-\d{2}); Info: (?<channel_hint>UPI|IMPS|NEFT)/(?<merchant>[^.]+?)\. Avl Bal Rs\s?(?<balance>[\d,]+(?:\.\d{1,2})?)'
  - id: icici.acct.credit.v1
    kind: CREDIT
    channel: OTHER
    date_format: dd-MMM-yy
    pattern: 'Acct XX(?<last4>\d{4}) credited with Rs\s?(?<amount>[\d,]+(?:\.\d{1,2})?) on (?<date>\d{2}-[A-Za-z]{3}-\d{2}); Info: (?<channel_hint>UPI|IMPS|NEFT)/(?<payee>[^.]+?)\. Avl Bal Rs\s?(?<balance>[\d,]+(?:\.\d{1,2})?)'
  - id: icici.atm.v1
    kind: DEBIT
    channel: ATM
    date_format: dd-MMM-yy
    pattern: 'Acct XX(?<last4>\d{4}) debited for Rs\s?(?<amount>[\d,]+(?:\.\d{1,2})?) on (?<date>\d{2}-[A-Za-z]{3}-\d{2}); Info: ATM-WDL/(?<merchant>[^.]+?)\. Avl Bal Rs\s?(?<balance>[\d,]+(?:\.\d{1,2})?)'
  - id: icici.card.spend.v1
    kind: DEBIT
    channel: CARD
    account_type: CREDIT_CARD
    date_format: dd-MMM-yy
    pattern: 'Rs\s?(?<amount>[\d,]+(?:\.\d{1,2})?) spent using ICICI Bank Card XX(?<last4>\d{4}) on (?<date>\d{2}-[A-Za-z]{3}-\d{2}) at (?<merchant>[^.]+?)\.'
  - id: icici.autodebit.v1
    kind: DEBIT
    channel: AUTO_DEBIT
    date_format: dd-MMM-yy
    pattern: 'Acct XX(?<last4>\d{4}) debited for Rs\s?(?<amount>[\d,]+(?:\.\d{1,2})?) on (?<date>\d{2}-[A-Za-z]{3}-\d{2}); Info: ACH/(?<merchant>[^.]+?)\. Avl Bal Rs\s?(?<balance>[\d,]+(?:\.\d{1,2})?)'
  - id: icici.balance.v1
    kind: BALANCE
    channel: OTHER
    date_format: dd-MMM-yy
    pattern: 'Avl Bal in Acct XX(?<last4>\d{4}) is Rs\s?(?<balance>[\d,]+(?:\.\d{1,2})?) on (?<date>\d{2}-[A-Za-z]{3}-\d{2})'
