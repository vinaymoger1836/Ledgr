# Bank registry (docs/03 §3, docs/05 §2). Maps SMS sender headers to banks.
#
# Every header below is a starting suggestion written from general knowledge, NOT from your inbox:
# `verify: true` means "not yet checked against a real SMS". Profile -> Senders seen lists the headers that
# really exist in your inbox; the headers you confirm there are stored on your accounts and win over this file.
#
# id:           stable key stored in account.bank_id (lower_snake_case)
# color:        card accent as #RRGGBB (white text on it must stay >= 4.5:1; the UI picks the text colour)
# headers:      account/UPI alert headers, upper-case, without the 2-letter prefix or -S/-T/-P/-G suffix
# card_headers: credit-card alert headers
version: "2026.11.1"
banks:
  - { id: hdfc,      name: "HDFC Bank",              color: "#004C8F", headers: [HDFCBK, HDFCBN], card_headers: [HDFCCC],  verify: true }
  - { id: icici,     name: "ICICI Bank",             color: "#A8420A", headers: [ICICIB, ICICIT], card_headers: [],         verify: true }
  - { id: sbi,       name: "State Bank of India",    color: "#1565A8", headers: [SBIINB, SBIPSG, SBIUPI, ATMSBI], card_headers: [SBICRD], verify: true }
  - { id: axis,      name: "Axis Bank",              color: "#97144D", headers: [AXISBK],         card_headers: [],         verify: true }
  - { id: kotak,     name: "Kotak Mahindra Bank",    color: "#C8102E", headers: [KOTAKB],         card_headers: [],         verify: true }
  - { id: pnb,       name: "Punjab National Bank",   color: "#A6192E", headers: [PNBSMS],         card_headers: [],         verify: true }
  - { id: bob,       name: "Bank of Baroda",         color: "#B8430B", headers: [BOBTXN, BARODA], card_headers: [],         verify: true }
  - { id: canara,    name: "Canara Bank",            color: "#0B6E99", headers: [CANBNK],         card_headers: [],         verify: true }
  - { id: union,     name: "Union Bank of India",    color: "#B3262B", headers: [UNIONB],         card_headers: [],         verify: true }
  - { id: idfc,      name: "IDFC FIRST Bank",        color: "#9C1D3B", headers: [IDFCFB],         card_headers: [],         verify: true }
  - { id: indusind,  name: "IndusInd Bank",          color: "#7A1C3A", headers: [INDUSB],         card_headers: [],         verify: true }
  - { id: yes,       name: "YES Bank",               color: "#1E4FB5", headers: [YESBNK],         card_headers: [],         verify: true }
  - { id: federal,   name: "Federal Bank",           color: "#0F5C7A", headers: [FEDBNK],         card_headers: [],         verify: true }
  - { id: idbi,      name: "IDBI Bank",              color: "#00796B", headers: [IDBIBK],         card_headers: [],         verify: true }
  - { id: bandhan,   name: "Bandhan Bank",           color: "#C0392B", headers: [BANDHN],         card_headers: [],         verify: true }
  - { id: rbl,       name: "RBL Bank",               color: "#2E3A8C", headers: [RBLBNK],         card_headers: [],         verify: true }
  - { id: au,        name: "AU Small Finance Bank",  color: "#8A4B08", headers: [AUBANK],         card_headers: [],         verify: true }
  - { id: paytm_pb,  name: "Paytm Payments Bank",    color: "#00619E", headers: [PYTMPB, PAYTMB], card_headers: [],         verify: true }
  # Anything not listed above (a wallet, a co-op bank...). No headers: assign them in Senders seen.
  - { id: other,     name: "Other bank or wallet",   color: "#475569", headers: [],               card_headers: [],         verify: false }
